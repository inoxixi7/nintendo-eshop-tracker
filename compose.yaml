x-default-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *default-logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${DATA_DIR:-../data/postgres}
        target: /var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      CATALOG_CRON: ${CATALOG_CRON:-0 3 * * *}
      PRICE_CRON: ${PRICE_CRON:-0 */6 * * *}
      TZ: ${TZ:-Asia/Tokyo}
      RUN_ON_STARTUP: ${RUN_ON_STARTUP:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    healthcheck:
      # /proc/1/comm reads "MainThread" under Node 24, so check PID 1's argv[0] instead
      test: ["CMD-SHELL", "tr '\\0' '\\n' < /proc/1/cmdline | head -n 1 | grep -qx node && test -f /tmp/nintendo-eshop-worker-ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      # readiness waits for the startup sync (~8 min for JP); matches g3-bootstrap's 900 s wait
      start_period: 15m

  api:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "apps/api/dist/main.js"]
    restart: unless-stopped
    environment:
      # read-only sessions: the API must never write, even through a bug
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}?options=-c%20default_transaction_read_only%3Don
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      # loopback only; reach it through `tailscale serve`, never the LAN
      - "127.0.0.1:${API_PORT:-8194}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    <<: *default-logging
    image: postgres:17-alpine
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-172800}
    command: ["sh", "/usr/local/bin/run-backup.sh", "loop"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${BACKUP_DIR:-../backups}
        target: /backups
      - type: bind
        source: ./deploy/backup/run.sh
        target: /usr/local/bin/run-backup.sh
        read_only: true
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "sh /usr/local/bin/run-backup.sh health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3m

networks:
  private:
    driver: bridge
